<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta informacija -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignas Valiukas</title>

    <!-- CSS failai -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/extra.css">

    <!-- Bootstrap karkasas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigacija -->
    <header>
        <nav>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="signin.html">Sign up</a></li>
                <li><a href="aboutus.html">About us</a></li>
                <li><a href="contacts.html">Contacts</a></li>
            </ul>
        </nav>
    </header>

    <!-- Kontaktų sekcija -->
    <main class="page-container">
        <section class="hero-box">
            <h1>Contact us</h1>
            <p>You can reach us by phone, email, or by filling out the form below.</p>
        </section>

        <section class="contact-flex">
            <div class="box">
                <h3>Contact details</h3>
                <p><b>Phone:</b> +370 600 12345</p>
                <p><b>Email:</b> porsche@shop.lt</p>
                <p><b>Address:</b> Vilnius, Lithuania</p>
                <button class="btn btn-success" onclick="showContactMessage()">Show message</button>
            </div>

            <div class="box">
                <h3>Quick contact form</h3>
                <form onsubmit="submitContactForm(event)">
                    <label for="name">Name:</label><br>
                    <input type="text" id="name" name="name" required><br><br>

                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="message">Message:</label><br>
                    <textarea id="message" name="message" rows="5" required></textarea><br><br>

                    <button type="submit" class="btn btn-primary">Send</button>
                </form>
            </div>
        </section>
    </main>

    <script src="/js/pages.js"></script>
</body>
</html>
